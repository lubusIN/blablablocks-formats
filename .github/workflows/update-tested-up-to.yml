name: Update Tested Up To

on:
    schedule:
        - cron: '37 6 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-tested-up-to:
        uses: lubusIN/.github/.github/workflows/update-tested-up-to.yml@main
        with:
            plugin-slug: blablablocks-formats
            release-branch: main
        secrets:
            SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
            SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
